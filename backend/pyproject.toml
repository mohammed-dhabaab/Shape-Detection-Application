[project]
name = "shape-detection-backend"
version = "1.0.0"
description = "FastAPI service that detects and classifies geometric shapes in images."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.1",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "SIM", "C4", "RUF", "PL", "PT", "RET", "TID", "ANN", "S",
]
ignore = [
    "PLR0913", # use-case/adapter constructors legitimately take several collaborators
    "PLR2004", # thresholds are named config values; small literals in geometry are self-describing
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004"]
"scripts/**" = ["S311"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
